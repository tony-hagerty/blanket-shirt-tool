<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blanket Shirt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <header class="masthead">
        <h1>Blanket <em>Shirt</em></h1>
        <p>Layout planner for t-shirt quilts</p>
      </header>

      <section class="section">
        <h2><span class="num">01</span> Size limits <span class="unit">inches</span></h2>
        <div class="limits">
          <span></span>
          <span class="col-label">Min</span>
          <span class="col-label">Max</span>

          <span class="row-label">Width</span>
          <input type="number" id="minWidth" min="0" step="0.5" value="1" aria-label="Minimum width">
          <input type="number" id="maxWidth" min="0" step="0.5" value="12" aria-label="Maximum width">

          <span class="row-label">Height</span>
          <input type="number" id="minHeight" min="0" step="0.5" value="1" aria-label="Minimum height">
          <input type="number" id="maxHeight" min="0" step="0.5" value="12" aria-label="Maximum height">
        </div>
      </section>

      <section class="section section-pieces">
        <h2><span class="num">02</span> Pieces <span class="unit" id="summary"></span></h2>
        <form class="add-piece" id="addForm">
          <input type="text" id="rectName" placeholder="Name a new piece…" autocomplete="off">
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <ul id="rectangleList" class="piece-list"></ul>
      </section>

      <footer class="section file-actions">
        <button id="saveLayout" class="btn">Save</button>
        <button id="loadLayout" class="btn">Open…</button>
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
      </footer>
    </aside>

    <main class="canvas-area">
      <button id="sidebarToggle" class="btn btn-float sidebar-toggle" aria-controls="sidebar" aria-expanded="false">Pieces</button>
      <div class="toolbar">
        <span id="zoomIndicator" class="zoom">100%</span>
        <button id="resetView" class="btn btn-float" title="Fit all pieces in view">Fit</button>
      </div>
      <div id="canvas" class="canvas">
        <svg id="grid" class="layer grid"></svg>
        <svg id="rectangles" class="layer"></svg>
      </div>
      <p class="legend">1 square = 1 inch</p>
    </main>
  </div>

  <div id="colorPicker" class="color-picker" popover>
    <div id="colorGrid" class="color-grid"></div>
    <label class="color-custom">
      <input type="color" id="customColor">
      <span>Custom…</span>
    </label>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
