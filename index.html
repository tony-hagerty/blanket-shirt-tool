<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rectangle Layout Tool</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="app">
    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
    <aside class="sidebar">
      <h2>Dimensions</h2>
      <div class="dimension-inputs">
        <div class="input-group">
          <label for="minWidth">Min W (in)</label>
          <input type="number" id="minWidth" min="0" step="0.5" value="1">
        </div>
        <div class="input-group">
          <label for="maxWidth">Max W (in)</label>
          <input type="number" id="maxWidth" min="0" step="0.5" value="12">
        </div>
        <div class="input-group">
          <label for="minHeight">Min H (in)</label>
          <input type="number" id="minHeight" min="0" step="0.5" value="1">
        </div>
        <div class="input-group">
          <label for="maxHeight">Max H (in)</label>
          <input type="number" id="maxHeight" min="0" step="0.5" value="12">
        </div>
      </div>

      <div class="add-rect-group">
        <input type="text" id="rectName" placeholder="Rectangle name (optional)" class="name-input">
        <button id="addRectangle" class="btn-add">+ Add Rectangle</button>
      </div>

      <h3>Rectangles</h3>
      <ul id="rectangleList" class="rectangle-list"></ul>

      <div class="file-actions">
        <button id="saveLayout" class="btn-file">Save JSON</button>
        <button id="loadLayout" class="btn-file">Load JSON</button>
      </div>
      <input type="file" id="fileInput" accept=".json" style="display:none">
    </aside>

    <main class="canvas-area">
      <button id="resetView" class="btn-reset" title="Reset view">Reset View</button>
      <div id="canvas" class="canvas">
        <svg id="grid" class="grid"></svg>
        <svg id="rectangles" class="rectangles-layer"></svg>
        <div id="zoomIndicator" class="zoom-indicator">100%</div>
      </div>
    </main>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
